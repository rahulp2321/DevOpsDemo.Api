name: CI (pull requests)

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DevOpsDemo.Api.csproj
      - run: dotnet build DevOpsDemo.Api.csproj -c Release --no-restore
      # - run: dotnet test   # add when you have tests
      - name: Docker build check (no push)
        run: docker build -t ci-check .
