name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore DevOpsDemo.Api.csproj

      - name: Build API
        run: dotnet build DevOpsDemo.Api.csproj --configuration Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install UI dependencies
        working-directory: src/devops-demo-ui
        run: npm install

      - name: Build UI
        working-directory: src/devops-demo-ui
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: docker build -f docker/api/Dockerfile -t ghcr.io/${{ github.repository_owner }}/devops-demo-api:${{ github.sha }} .

      - name: Build UI image
        run: docker build -f docker/ui/Dockerfile -t ghcr.io/${{ github.repository_owner }}/devops-demo-ui:${{ github.sha }} .

      - name: Push API image
        run: docker push ghcr.io/${{ github.repository_owner }}/devops-demo-api:${{ github.sha }}

      - name: Push UI image
        run: docker push ghcr.io/${{ github.repository_owner }}/devops-demo-ui:${{ github.sha }}

      - name: Create release metadata
        run: |
          mkdir -p artifact
          echo "API_IMAGE=ghcr.io/${{ github.repository_owner }}/devops-demo-api:${{ github.sha }}" > artifact/release.env
          echo "UI_IMAGE=ghcr.io/${{ github.repository_owner }}/devops-demo-ui:${{ github.sha }}" >> artifact/release.env
          echo "COMMIT=${{ github.sha }}" >> artifact/release.env

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: artifact/
